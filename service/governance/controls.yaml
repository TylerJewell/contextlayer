# The controls of the system contextlayer, as a controls draft the Akka local console reads, decides and signs.
#
# Every row is one control with exactly one of Verify's five mechanisms (sanitizer, guardrail, human, eval, gate) and
# one of that mechanism's flavors, its sub-type. Guardrails name their hook; sanitizers, evals and gates carry the
# configuration block Verify defines for them (sanitizer_config, eval_config, gate_config) and humans their
# human_config. Each mechanism has one proof event, the record every verdict of its controls is written as.
#
# Every row is an officer row: the organisation wrote it, and everything the service needs to enforce it is in the
# row, so a signed bundle carries it whole. The regulations, frameworks and standards a control meets are listed under
# `implements` as ids of corpus 2026-09; they are references, not definitions, and no corpus is held here.
#
# Verify's guardrail hooks are points in an agent's lifecycle. Guardrails here that act on a call the service makes
# (an action, a source read, a question) or on something that is not a call (data arriving, a caller, a definition, a
# case closing) declare before-tool-call; hooks for them are a proposal to Verify. gate_config.runs_at is likewise a
# proposed extension: at-deployment gates run once, inside the release, when it first starts.
#
# A row's decision (sign_off) is made in the console, which signs the decided rows as the next bundle into
# governance/signed/. Each row has a stable row_id, the one key every piece of evidence the service emits carries.
# Changing a control changes the catalog digest, which every evidence record carries.
#
# minimum_review_seconds is measured from when a person claims an event, so a control whose decision is made in one
# call sets it to 0: the decision is recorded with its rationale and authority, but no review time exists to measure.
