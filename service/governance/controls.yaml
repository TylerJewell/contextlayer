        at: '2026-10-21T00:00:00Z'
    summary: >-
      The service checks its control catalog when a release first starts: every row has a mechanism, a flavor,
      a proof event and the configuration its mechanism needs. A release whose catalog is not valid does not
      start.
    proof_event: GateEvaluated
    boundary: AT_DEPLOYMENT
    applies_to: [deployer]
    gate_config:
      document_kind: control-catalog
      artifact_pattern: governance/controls.yaml
      check_intent: the catalog parses and every row is complete for its mechanism
      fails_when: 'any row is missing a field its mechanism needs, or a row id appears twice'
      blocks: release
      runs_at: [at-deployment]
    sign_off:
      decision: approve
      reviewer: tyler
      at: '2026-10-21T12:02:24Z'

