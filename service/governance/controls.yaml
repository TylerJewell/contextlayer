# The controls of the system contextlayer, as a controls draft the Akka local console reads, decides and signs.
#
# Every row is an officer row: the organisation wrote it, and everything the service needs to enforce it (its
# mechanism, proof event, boundary and human_config) is in the row, so a signed bundle carries it whole. The
# regulations, frameworks and standards a control meets are listed under `implements` as ids of corpus 2026-09; they
# are references, not definitions, and no corpus is held here.
#
# A row's decision (sign_off) is made in the console, which signs the decided rows as the next bundle into
# governance/signed/. Each row has a stable row_id, the one key every piece of evidence the service emits carries.
# Changing a control changes the catalog digest, which every evidence record carries.
#
# minimum_review_seconds is measured from when a person claims an event, so a control whose
# decision is made in one call (releases, stages, packs) sets it to 0: the
# decision is recorded with its rationale and authority, but no review time exists to measure.
schema_version: 1
matrix_id: contextlayer
revision: 1
rows:
  - row_id: custom-cl0001
    name: Personal data is masked before a model call
    mechanism: sanitizer
    lifecycle: preventative
    corpus_ref: null
    implements: [iso-42001.a-7-4.sanitizer]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: Email, phone, card, IBAN and IP address values are masked in text sent to a model.
    proof_event: GuardrailDecisionRecorded
    boundary: BEFORE_LLM_CALL
    applies_to: [deployer]

  - row_id: custom-cl0002
    name: A model may only answer with a label the playbook allows
    mechanism: guardrail
    lifecycle: preventative
    corpus_ref: null
    implements: [aws-agentic-scoping.scope2-human-approval]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: >-
      A model's answer outside the labels the playbook step lists is refused and the step fails. The runtime's
      label-allowed-evaluator also judges every classifier interaction from its ledger and records the verdict.
    proof_event: GuardrailDecisionRecorded
    boundary: WORKFLOW_STEP
    applies_to: [deployer]

  - row_id: custom-cl0003
    name: A playbook action above the autonomy limit needs a person's approval
    mechanism: human
    lifecycle: preventative
    corpus_ref: null
    implements: [aws-agentic-scoping.scope2-human-approval]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: Medium and high risk actions wait for a person who did not request them.
    proof_event: HumanDecisionRecorded
    boundary: WORKFLOW_STEP
    applies_to: [deployer]
    human_config:
      flavor: human-system-authorization
      subject_kind: action
      mode: HITL
      blocking: true
      roles: [approver]
      review_mode: SINGLE
      required: 1
      independence: [proposer]
      accountable_owner: approver
      sla_target: PT24H
      timeout_behaviour: RESUME_WITH_DEFAULT
      timeout_default: DENY
      escalation_chain: [approver, admin]
      allowed_actions: [APPROVE, DENY, ESCALATE, REQUEST_MORE_INFO]
      rationale_required: true
      minimum_review_seconds: 10
      enforce_minimum: false

  - row_id: custom-cl0004
    name: Identity links that join records are confirmed by a reviewer
    mechanism: human
    lifecycle: preventative
    corpus_ref: null
    implements: [eu-ai-act.art14.4.d]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: Records of different types are joined only through links a reviewer confirmed.
    proof_event: HumanDecisionRecorded
    boundary: STATE_TRANSITION
    applies_to: [deployer]
    human_config:
      flavor: human-domain-decision
      subject_kind: change
      mode: HITL
      blocking: true
      roles: [reviewer]
      review_mode: SINGLE
      required: 1
      independence: []
      accountable_owner: reviewer
      sla_target: P7D
      timeout_behaviour: RAISE_TIMEOUT
      timeout_default: null
      escalation_chain: [reviewer, admin]
      allowed_actions: [APPROVE, DENY, ESCALATE]
      rationale_required: true
      minimum_review_seconds: 5
      enforce_minimum: false

  - row_id: custom-cl0005
    name: A playbook release and its stage changes are approved by its owner
    mechanism: human
    lifecycle: preventative
    corpus_ref: null
    implements: [aicpa-soc2.cc8-1.change-authorization]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: A release becomes runnable, and a playbook changes stage, only on its owner's decision.
    proof_event: HumanDecisionRecorded
    boundary: STATE_TRANSITION
    applies_to: [deployer]
    human_config:
      flavor: human-system-authorization
      subject_kind: change
      mode: HITL
      blocking: true
      roles: [approver]
      review_mode: SINGLE
      required: 1
      independence: []
      accountable_owner: approver
      sla_target: P3D
      timeout_behaviour: RAISE_TIMEOUT
      timeout_default: null
      escalation_chain: [approver, admin]
      allowed_actions: [APPROVE, DENY, ESCALATE]
      rationale_required: true
      minimum_review_seconds: 0
      enforce_minimum: false

  - row_id: custom-cl0006
    name: A connector pack goes live only on someone else's activation
    mechanism: human
    lifecycle: preventative
    corpus_ref: null
    implements: [aicpa-soc2.cc8-1.change-authorization]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: The person who imported a pack version cannot be the one who activates it.
    proof_event: HumanDecisionRecorded
    boundary: STATE_TRANSITION
    applies_to: [deployer]
    human_config:
      flavor: human-system-authorization
      subject_kind: change
      mode: HITL
      blocking: true
      roles: [approver]
      review_mode: SINGLE
      required: 1
      independence: [proposer]
      accountable_owner: approver
      sla_target: P3D
      timeout_behaviour: RAISE_TIMEOUT
      timeout_default: null
      escalation_chain: [approver, admin]
      allowed_actions: [APPROVE, DENY, ESCALATE]
      rationale_required: true
      minimum_review_seconds: 0
      enforce_minimum: false

  - row_id: custom-cl0007
    name: Actions a playbook may never take are refused by policy
    mechanism: gate
    lifecycle: preventative
    corpus_ref: null
    implements: [aws-agentic-scoping.scope2-human-approval]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: Action policy refuses actions classed never-by-assistant, and any action from a playbook that is not live.
    proof_event: ControlEvaluationRecorded
    boundary: WORKFLOW_STEP
    applies_to: [deployer]

  - row_id: custom-cl0008
    name: Rushed human decisions are counted
    mechanism: eval
    lifecycle: detective
    corpus_ref: null
    implements: [eu-ai-act.art14.5.rubber-stamp-rate]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: A decision submitted before the control's minimum review time is flagged below-minimum.
    proof_event: HumanDecisionRecorded
    boundary: STATE_TRANSITION
    applies_to: [deployer]

  - row_id: custom-cl0009
    name: Calls to a source go only to allowed hosts
    mechanism: gate
    lifecycle: preventative
    corpus_ref: null
    implements: [eu-ai-act.art15.4]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: A source call to a host outside the egress allow list is refused before it is sent.
    proof_event: ControlEvaluationRecorded
    boundary: BEFORE_TOOL_CALL
    applies_to: [deployer]

  - row_id: custom-cl0010
    name: Jailbreak-like text sent to a model is detected
    mechanism: guardrail
    lifecycle: detective
    corpus_ref: null
    implements: [owasp-agent-control-standard.prompt-injection.content-eval]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: >-
      The runtime compares the text of each model call with known jailbreak examples and reports a
      match. It is report-only, so its records are advisory and do not count as proof until it blocks.
    proof_event: GuardrailDecisionRecorded
    boundary: BEFORE_LLM_CALL
    applies_to: [deployer]

  - row_id: custom-cl0011
    name: An approver can halt a playbook at once
    mechanism: human
    lifecycle: corrective
    corpus_ref: null
    implements: [argus.jsp936.halt-provision-exercised]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: One approver can stop a playbook; its actions are refused and its runs stop until it is restarted.
    proof_event: HumanDecisionRecorded
    boundary: STATE_TRANSITION
    applies_to: [deployer]
    human_config:
      flavor: human-halt
      subject_kind: system
      mode: HALT
      blocking: true
      roles: [approver]
      review_mode: SINGLE
      required: 1
      independence: []
      accountable_owner: approver
      sla_target: PT1H
      timeout_behaviour: RAISE_TIMEOUT
      timeout_default: null
      escalation_chain: [approver, admin]
      allowed_actions: [APPROVE, DENY, ESCALATE]
      rationale_required: true
      minimum_review_seconds: 0
      enforce_minimum: false

  - row_id: custom-cl0012
    name: A halted playbook is restarted only by two different approvers
    mechanism: human
    lifecycle: preventative
    corpus_ref: null
    implements: [argus.jsp936.halt-provision-exercised]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: Stopping is quick and starting again is not; a restart needs two approvers who each give a reason.
    proof_event: HumanDecisionRecorded
    boundary: STATE_TRANSITION
    applies_to: [deployer]
    human_config:
      flavor: human-halt
      subject_kind: system
      mode: HALT
      blocking: true
      roles: [approver]
      review_mode: TWO_PERSON
      required: 2
      independence: []
      accountable_owner: approver
      sla_target: P1D
      timeout_behaviour: RAISE_TIMEOUT
      timeout_default: null
      escalation_chain: [approver, admin]
      allowed_actions: [APPROVE, DENY, ESCALATE]
      rationale_required: true
      minimum_review_seconds: 0
      enforce_minimum: false

  - row_id: custom-cl0013
    name: A model drafting a question sees the shape of the data, never the records
    mechanism: guardrail
    lifecycle: preventative
    corpus_ref: null
    implements: [iso-27701.s7-4-5-minimisation-sanitizer]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: >-
      To turn a request in words into a question, the model is shown entity types, field names and
      kinds, and the few values of fields that hold a handful of categories. The runtime's question-shape
      guardrail refuses any call whose data block is more than that shape. The draft is checked against the
      schema, and a person reads and runs the question; the model never runs it.
    proof_event: GuardrailDecisionRecorded
    boundary: BEFORE_LLM_CALL
    applies_to: [deployer]

  - row_id: custom-cl0014
    name: Records of two data domains are linked in one question only under an approved join rule
    mechanism: human
    lifecycle: preventative
    corpus_ref: null
    implements: [iso-27701.s7-4-5-minimisation-sanitizer]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: Linking data domains, such as claims and wealth, is approved by someone other than whoever last changed either domain.
    proof_event: HumanDecisionRecorded
    boundary: STATE_TRANSITION
    applies_to: [deployer]
    human_config:
      flavor: human-system-authorization
      subject_kind: change
      mode: HITL
      blocking: true
      roles: [approver]
      review_mode: SINGLE
      required: 1
      independence: [proposer]
      accountable_owner: approver
      sla_target: P3D
      timeout_behaviour: RAISE_TIMEOUT
      timeout_default: null
      escalation_chain: [approver, admin]
      allowed_actions: [APPROVE, DENY, ESCALATE]
      rationale_required: true
      minimum_review_seconds: 0
      enforce_minimum: false

  - row_id: custom-cl0015
    name: A question reads only the data domains its asker is granted
    mechanism: gate
    lifecycle: preventative
    corpus_ref: null
    implements: [iso-27701.s7-4-5-minimisation-sanitizer]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: Once a project has data domains, a question that reads a type outside them, a domain the asker is not granted, or two domains with no approved join rule is refused.
    proof_event: ControlEvaluationRecorded
    boundary: WORKFLOW_STEP
    applies_to: [deployer]

  - row_id: custom-cl0016
    name: An answer to a compliance question says only what recorded facts say
    mechanism: guardrail
    lifecycle: preventative
    corpus_ref: null
    implements: [iso-42001.a-7-4.sanitizer]
    provenance:
      kind: officer
      authored_by:
        user: tylerjewell@gmail.com
        at: '2026-10-20T00:00:00Z'
    summary: >-
      A model chooses which fixed question was asked, the facts are computed from recorded data, and a second model words them.
      Its words are checked against the facts, and an answer that adds a number, a control or a verdict they do not state is
      replaced by the facts in plain form. The runtime's compliance-wording-evaluator records the same check on every answer.
    proof_event: GuardrailDecisionRecorded
    boundary: AFTER_LLM_CALL
    applies_to: [deployer]
