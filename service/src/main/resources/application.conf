akka.javasdk.dev-mode.http-port = 9162

# Model for the classifier agent. Set GOOGLE_AI_GEMINI_API_KEY to use it; tests replace the model
# with a mock, so no key is needed to build or test. Quality on a labelled set: see
# docs/MODEL-EVAL.md (LiveModelEvalIntegrationTest).
akka.javasdk.agent {
  model-provider = googleai-gemini
  googleai-gemini {
    model-name = "gemini-2.5-flash"
  }
}

# Every agent that calls a model. Each one gets the sanitizers and the jailbreak guardrail below.
contextlayer.model-agents = ["classifier-agent", "question-agent", "compliance-intent-agent", "compliance-summary-agent"]

# Governance at the model boundary. Each entry names the control it implements (control-id), which is
# the key that joins what the runtime records to governance/controls.yaml.
akka.javasdk.sanitization.sanitizers {
  "personal email" { predefined = EMAIL, apply-at = [model-call], agents = ${contextlayer.model-agents}, control-id = "custom-cl0001" }
  "personal phone" { predefined = PHONE, apply-at = [model-call], agents = ${contextlayer.model-agents}, control-id = "custom-cl0001" }
  "personal card" { predefined = CREDIT_CARD, apply-at = [model-call], agents = ${contextlayer.model-agents}, control-id = "custom-cl0001" }
  "personal iban" { predefined = IBAN, apply-at = [model-call], agents = ${contextlayer.model-agents}, control-id = "custom-cl0001" }
  "personal ip" { predefined = IP_ADDRESS, apply-at = [model-call], agents = ${contextlayer.model-agents}, control-id = "custom-cl0001" }
}

# Report-only until the false-positive rate on real records is known; a match is recorded, not refused.
akka.javasdk.agent.guardrails {
  "model-call jailbreak" {
    class = "akka.javasdk.agent.ModelCallSimilarityGuard"
    agents = ${contextlayer.model-agents}
    category = JAILBREAK
    report-only = true
    threshold = 0.75
    bad-examples-resource-dir = "guardrail/jailbreak"
    control-id = "custom-cl0010"
  }
  # Refuses the call when the question model would be shown more than the shape of the data.
  "question shape only" {
    class = "io.akka.contextlayer.application.QuestionShapeGuardrail"
    agents = ["question-agent"]
    category = PII
    control-id = "custom-cl0013"
  }
}

# The runtime judges each interaction of these agents and records the verdict in its ledger under the control.
akka.javasdk.evaluation.evaluators {
  label-allowed-evaluator {
    control-id = "custom-cl0002"
    agents { classifier-agent { trigger = interaction } }
  }
  compliance-wording-evaluator {
    control-id = "custom-cl0016"
    agents { compliance-summary-agent { trigger = interaction } }
  }
}

contextlayer {
  # Hosts the platform may call when reading sources. Empty allows nothing.
  # An entry is an exact host or "*.example.com" for any subdomain.
  egress.allowed-hosts = []
  # More hosts, comma separated, for a developer machine: CONTEXTLAYER_ALLOWED_HOSTS=localhost
  egress.extra-hosts = ""
  egress.extra-hosts = ${?CONTEXTLAYER_ALLOWED_HOSTS}

  # Development only. When set, every credential reference resolves to this value.
  dev-secret = ""
  dev-secret = ${?CONTEXTLAYER_DEV_SECRET}

  # Ceilings on every read from a source.
  limits {
    max-pages = 50
    max-records = 5000
    max-response-bytes = 5000000
    timeout-seconds = 10
    max-rate-wait-millis = 2000
  }

  # Development only: credential reference -> credential. Replace with a key management
  # service in any shared deployment.
  secrets {}

  # The entity store. Set NEO4J_PASSWORD (and NEO4J_URI / NEO4J_USER if they differ).
  neo4j {
    uri = "bolt://localhost:7687"
    uri = ${?NEO4J_URI}
    user = "neo4j"
    user = ${?NEO4J_USER}
    password = ""
    password = ${?NEO4J_PASSWORD}
  }
}

contextlayer {
  # The project this service runs in. Everything it stores belongs to this project. The platform puts
  # the project id in the environment of a deployed service; a local run uses the name below.
  project-id = "local"
  project-id = ${?KALIX_META_PROJECT}
}

# The one mail server a route of format "email" sends through. Left blank, email routes can be set up but every delivery
# fails and says that email is not set up. The server host must also be on the egress list. password-ref is a reference to
# where the password is kept, never the password.
contextlayer.notifications.email {
  host = ""
  host = ${?CONTEXTLAYER_SMTP_HOST}
  port = 587
  port = ${?CONTEXTLAYER_SMTP_PORT}
  # none, starttls or ssl
  security = "starttls"
  security = ${?CONTEXTLAYER_SMTP_SECURITY}
  user = ""
  user = ${?CONTEXTLAYER_SMTP_USER}
  password-ref = ""
  password-ref = ${?CONTEXTLAYER_SMTP_PASSWORD_REF}
  from = ""
  from = ${?CONTEXTLAYER_SMTP_FROM}
}
